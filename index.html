<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食在哈囉｜線上點餐</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}header{position:sticky;top:0;z-index:10;background:#fff;padding:16px 12px 8px;box-shadow:0 2px 8px #0002}h1{margin:0;font-size:22px}.sub{color:#777;font-size:13px;margin-top:4px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 0 5px}.tab{white-space:nowrap;border:0;border-radius:20px;padding:9px 12px;background:#eee;font-size:14px}.tab.active{background:#222;color:#fff}main{max-width:720px;margin:auto;padding:14px 12px 105px}section{scroll-margin-top:125px}.title{font-size:19px;font-weight:800;margin:10px 0}.grid{display:grid;gap:9px}.card{background:#fff;border-radius:15px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 5px #0001}.code{font-size:12px;color:#888;font-weight:700}.name{font-size:16px;font-weight:700;margin-top:3px}.price{font-size:14px;font-weight:800;margin-top:4px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:40px;height:40px;border:0;border-radius:50%;font-size:22px;background:#eee}.num{min-width:22px;text-align:center;font-weight:800}.panel{background:#fff;border-radius:15px;padding:15px;margin-top:15px}.panel h2{font-size:19px;margin:0 0 10px}.line{padding:7px 0;border-bottom:1px solid #eee;font-size:14px}.total{text-align:right;font-size:21px;font-weight:900;margin-top:12px}label{display:block;font-weight:700;margin-top:10px}input,textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:16px}.primary,.copy{width:100%;padding:13px;border:0;border-radius:11px;font-weight:800;font-size:16px;margin-top:12px}.primary{background:#222;color:#fff}.copy{background:#eee}#result{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:10px;margin-top:10px;line-height:1.6;font-size:14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:9px 12px;box-shadow:0 -2px 9px #0002;z-index:20}.cart{width:100%;background:#222;color:#fff;border:0;border-radius:11px;padding:12px;font-size:16px;font-weight:800}
</style></head><body><header><h1>🍜 食在哈囉｜線上點餐</h1><div class="sub">選擇餐點與數量，完成後產生訂單</div><div class="tabs" id="tabs"></div></header><main><div id="menu"></div>
<div class="panel" id="cartPanel"><h2>🧾 訂單確認</h2><div id="cartList">尚未選擇餐點</div><div class="total" id="total">合計：0 元</div></div>
<div class="panel"><h2>👤 取餐資料</h2><label>姓名<input id="customer" placeholder="請輸入姓名"></label><label>電話<input id="phone" type="tel" placeholder="請輸入電話"></label><label>取餐日期<input id="date" type="date"></label><label>取餐時間<input id="time" type="time"></label><label>備註<textarea id="note" rows="3" placeholder="例如：不要蔥、少辣"></textarea></label><button class="primary" onclick="makeOrder()">✅ 產生訂單</button><div id="result" hidden></div><button id="copy" class="copy" hidden onclick="copyOrder()">📋 複製訂單，貼回 LINE</button></div></main>
<div class="bottom"><button class="cart" onclick="document.getElementById('cartPanel').scrollIntoView({behavior:'smooth'})">🛒 已選 <span id="count">0</span> 件　｜　合計 <span id="barTotal">0</span> 元</button></div>
<script>
const items=[{"id": "A1", "name": "滿漢大餐 蔥燒牛肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A2", "name": "滿漢大餐 豬肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A3", "name": "一度讚 豬肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A4", "name": "一度讚 牛肉", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "A5", "name": "拉麵道 豚骨", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "A6", "name": "味味A 排骨G麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "A7", "name": "維力 炸醬麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "A8", "name": "維力 炒泡麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "B1", "name": "辛拉麵", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "B2", "name": "韓式部隊鍋", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "B3", "name": "不倒翁 海鮮烏龍麵", "price": 130, "cat": "🍜 泡麵／主餐"}, {"id": "B4", "name": "三養食品 黑火雞麵", "price": 100, "cat": "🍜 泡麵／主餐"}, {"id": "C1", "name": "台式經典", "price": 160, "cat": "🍳 套餐"}, {"id": "C2", "name": "台式加蛋套餐", "price": 180, "cat": "🍳 套餐"}, {"id": "C3", "name": "韓式經典", "price": 160, "cat": "🍳 套餐"}, {"id": "C4", "name": "韓式加蛋套餐", "price": 180, "cat": "🍳 套餐"}, {"id": "D1", "name": "雞蛋", "price": 15, "cat": "🥚 加料"}, {"id": "D2", "name": "青菜", "price": 35, "cat": "🥚 加料"}, {"id": "D3", "name": "火鍋料", "price": 35, "cat": "🥚 加料"}, {"id": "D4", "name": "牛肉片", "price": 40, "cat": "🥚 加料"}, {"id": "D5", "name": "豬肉片", "price": 30, "cat": "🥚 加料"}, {"id": "D6", "name": "蝦子", "price": 50, "cat": "🥚 加料"}, {"id": "D7", "name": "魷魚", "price": 50, "cat": "🥚 加料"}, {"id": "D8", "name": "蛤蜊", "price": 50, "cat": "🥚 加料"}, {"id": "D9", "name": "起司片", "price": 20, "cat": "🥚 加料"}, {"id": "D10", "name": "玉米粒", "price": 15, "cat": "🥚 加料"}, {"id": "E1", "name": "古早味紅茶 700CC", "price": 30, "cat": "🥤 飲料"}, {"id": "F1", "name": "奶油蒜蝦", "price": 350, "cat": "🦐 熱炒"}, {"id": "F2", "name": "塔香炒蝦", "price": 350, "cat": "🦐 熱炒"}, {"id": "F3", "name": "水煮蝦", "price": 350, "cat": "🦐 熱炒"}, {"id": "F4", "name": "塔香蛤蜊", "price": 280, "cat": "🦐 熱炒"}, {"id": "F5", "name": "爆炒黃豆芽", "price": 120, "cat": "🦐 熱炒"}, {"id": "F6", "name": "五花肉炒豆干", "price": 220, "cat": "🦐 熱炒"}, {"id": "F7", "name": "空心菜炒牛肉", "price": 250, "cat": "🦐 熱炒"}, {"id": "G1", "name": "原味 四吋", "price": 180, "cat": "🍰 巴斯克蛋糕"}, {"id": "G2", "name": "原味 六吋", "price": 290, "cat": "🍰 巴斯克蛋糕"}, {"id": "G3", "name": "可可 四吋", "price": 180, "cat": "🍰 巴斯克蛋糕"}, {"id": "G4", "name": "可可 六吋", "price": 290, "cat": "🍰 巴斯克蛋糕"}, {"id": "G5", "name": "抹茶 四吋", "price": 180, "cat": "🍰 巴斯克蛋糕"}, {"id": "G6", "name": "抹茶 六吋", "price": 290, "cat": "🍰 巴斯克蛋糕"}];let cart={},orderText="";const cats=[...new Set(items.map(x=>x.cat))],tabs=document.getElementById("tabs"),menu=document.getElementById("menu");
cats.forEach((cat,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.textContent=cat;b.onclick=()=>document.getElementById("cat"+i).scrollIntoView({behavior:"smooth"});tabs.appendChild(b)});
cats.forEach((cat,i)=>{const s=document.createElement("section");s.id="cat"+i;s.innerHTML='<div class="title">'+cat+'</div><div class="grid"></div>';const g=s.querySelector(".grid");items.filter(x=>x.cat===cat).forEach(x=>{const d=document.createElement("div");d.className="card";d.innerHTML='<div><div class="code">'+x.id+'</div><div class="name">'+x.name+'</div><div class="price">'+x.price+' 元</div></div><div class="qty"><button type="button" onclick="change(\''+x.id+'\',-1)">−</button><div class="num" id="n-'+x.id+'">0</div><button type="button" onclick="change(\''+x.id+'\',1)">＋</button></div>';g.appendChild(d)});menu.appendChild(s)});
function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);if(!cart[id])delete cart[id];document.getElementById("n-"+id).textContent=cart[id]||0;renderCart()}
function renderCart(){const a=items.filter(x=>cart[x.id]);document.getElementById("cartList").innerHTML=a.length?a.map(x=>'<div class="line">'+x.id+'｜'+x.name+' × '+cart[x.id]+'　小計 '+x.price*cart[x.id]+' 元</div>').join(""):"尚未選擇餐點";const t=a.reduce((s,x)=>s+x.price*cart[x.id],0);document.getElementById("total").textContent="合計："+t+" 元";document.getElementById("barTotal").textContent=t;document.getElementById("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function makeOrder(){const a=items.filter(x=>cart[x.id]);if(!a.length)return alert("請先選擇餐點");const name=document.getElementById("customer").value.trim();if(!name)return alert("請填寫姓名");const t=a.reduce((s,x)=>s+x.price*cart[x.id],0);orderText="【食在哈囉｜新訂單】\n姓名："+name+"\n電話："+document.getElementById("phone").value.trim()+"\n取餐日期："+document.getElementById("date").value+"\n取餐時間："+document.getElementById("time").value+"\n\n"+a.map(x=>x.id+"｜"+x.name+" × "+cart[x.id]+"｜"+x.price*cart[x.id]+" 元").join("\n")+"\n\n合計："+t+" 元\n付款方式：現金\n取餐方式：外帶\n備註："+document.getElementById("note").value.trim();const r=document.getElementById("result");r.textContent=orderText;r.hidden=false;document.getElementById("copy").hidden=false;r.scrollIntoView({behavior:"smooth"})}
async function copyOrder(){try{await navigator.clipboard.writeText(orderText);alert("訂單已複製，可以貼回 LINE。")}catch(e){alert("請長按訂單文字後選擇「拷貝」。")}}
document.getElementById("date").value=new Date().toISOString().slice(0,10);renderCart();
</script></body></html>
